version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      S3_BUCKET: "thang.nguyen-flask"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-5000}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: always