version: '3.8'

services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      S3_BUCKET: "s3bucketdocker"
      DB_HOST: "database-1.ce9swmqyyoch.us-east-1.rds.amazonaws.com"
      DB_NAME: "appdb"
      DB_USER: "appuser"
      DB_PASS: "12345678"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-5000}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: always
