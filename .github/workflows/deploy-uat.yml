name: Deploy UAT (ECS)

on:
  push:
    branches: [ uat ]
    paths:
      - 'app/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional: chọn image tag để deploy (để trống = dùng short SHA)"
        required: false
        default: ""

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: 060314909360
  REGISTRY: 060314909360.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY: lab-flask
  CODEPIPELINE_NAME: cicd-flask-pipeline   # 👈 tên pipeline bạn đã tạo trên AWS

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::060314909360:role/oidc-uat-deployer
          role-session-name: github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I (verify OIDC)
        run: aws sts get-caller-identity

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi
          echo "Using tag: ${IMAGE_TAG}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 🔹 Build & Push image lên ECR
      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG} .
          docker push $REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

      # 🔹 Tạo file imagedefinitions.json — ECS deploy cần file này
      - name: Generate imagedefinitions.json
        run: |
          echo '[{"name":"lab-flask","imageUri":"'"$REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}"'"}]' > imagedefinitions.json
          cat imagedefinitions.json

      # 🔹 Trigger CodePipeline chạy
      - name: Trigger CodePipeline
        run: |
          aws codepipeline start-pipeline-execution --name $CODEPIPELINE_NAME

      # (Tùy chọn) Hiển thị trạng thái pipeline
      - name: Check CodePipeline status
        run: |
          aws codepipeline get-pipeline-state --name $CODEPIPELINE_NAME