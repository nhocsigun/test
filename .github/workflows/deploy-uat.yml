name: Deploy UAT (ECS)

on:
  push:
    branches: [uat]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: 060314909360
  ECR_REPO: lab-flask                 
  ECS_CLUSTER: flask-cluster          
  ECS_SERVICE: flask              
  SECRET_ID: key-env            
  TASKDEF_FILE: ecs-taskdef.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --- Lấy secret và tạo file .env ---
      - name: Fetch Secrets -> .env (ephemeral)
        id: fetch_secrets
        shell: bash
        env:
          SECRET_ID: ${{ env.SECRET_ID }}
        run: |
          set -e
          echo "Fetching secrets from Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString --output text)

          # Mask all values
          for v in $(echo "$SECRET_JSON" | jq -r '.[]'); do
            echo "::add-mask::$v"
          done

          # Write .env file
          echo "$SECRET_JSON" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > .env
          chmod 600 .env
          echo ".env file generated"

      # --- Build & Push Docker image ---
      - name: Build Docker image
        run: |
          echo "Building image..."
          docker build -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker tag $REGISTRY/$ECR_REPOSITORY:latest $REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

      - name: Push image to ECR
        run: |
          echo "Pushing image to ECR..."
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

      # --- Rolling update ECS service ---
      - name: Force new ECS deployment
        run: |
          echo "Triggering ECS rolling update..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          echo "ECS rolling update started"

      - name: Show ECS service status
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount}'
